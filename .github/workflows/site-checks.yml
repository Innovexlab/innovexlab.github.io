# Runs the site's automated checks on every pull request and push.
# Uses only the Python standard library — nothing to install.
# Recommended: make "site-checks" a required status check on the main branch.
#
# Security (docs/SECURITY.md):
# - read-only token; `pull_request` (never `pull_request_target`), so code from a
#   fork runs without secrets or write access;
# - third-party actions are pinned to a full commit SHA (a moved tag can't change
#   what runs); the comment gives the release. Update both together;
# - the checkout does not keep the token in .git/config;
# - axe-core is checked twice: the npm tarball's sha512 BEFORE it is unpacked,
#   then axe.min.js's sha256 inside tools/run_axe_check.py.
name: site-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Partials in sync, links, metadata, sitemap, claim rules, form, portal, security policy
        run: python tools/check_site.py
      - name: Browser smoke tests (menu, form validation, portal, no-JS fail-safe)
        run: python tools/run_browser_smoke.py --browser google-chrome
      - name: Keyboard (real Tab/Shift+Tab/Enter/Escape) on every page at 1366px and 390px
        run: python tools/run_keyboard_check.py --browser google-chrome
      - name: Security policy, injection and form-request checks (nothing is sent)
        run: python tools/run_security_check.py --browser google-chrome
      - name: axe-core WCAG scan (pinned 4.10.2; tarball sha512 + file sha256 verified)
        run: |
          curl -fsSL -o axe.tgz https://registry.npmjs.org/axe-core/-/axe-core-4.10.2.tgz
          echo "RE3mdQ7P3FRSe7eqCWoeQ/Z9QXrtniSjp1wUjt5nRC3WIpz5rSCve6o3fsZ2aCpJtrZjSZgjwXAoTO5k4tEI0w==" > expected.txt
          openssl dgst -sha512 -binary axe.tgz | base64 -w0 > actual.txt && echo >> actual.txt
          cmp expected.txt actual.txt || { echo "axe-core tarball integrity mismatch"; exit 1; }
          tar -xzf axe.tgz package/axe.min.js
          python tools/run_axe_check.py --axe package/axe.min.js --browser google-chrome
